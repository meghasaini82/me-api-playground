<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin Panel - Me API Playground</title>
</head>

<body>

    <script>
        /* =====================================================
           ✅ DEPLOYMENT FIX (ONLY REQUIRED CHANGE)
           ===================================================== */
        const API_BASE = 'https://me-api-gf6c.onrender.com/api/v1';
        /* ===================================================== */

        async function loadProfile() {
            try {
                /* ❌ OLD (wrong for deploy)
                const response = await fetch('https://me-api-gf6c.onrender.com/profile');
                */

                /* ✅ NEW (deploy-safe, backend matches) */
                const response = await fetch(`${API_BASE}/profile`);
                const result = await response.json();

                if (!result.success || !result.data) return;

                const data = result.data;

                document.getElementById('profile-name').innerText = data.name || '';
                document.getElementById('profile-education').innerText = '📚 ' + (data.education || '');
                document.getElementById('profile-email').innerText = '✉️ ' + (data.email || '');
                document.getElementById('profile-github').innerText = '💻 ' + (data.github || '');

                document.getElementById('name').value = data.name || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('education').value = data.education || '';
                document.getElementById('github').value = data.github || '';
                document.getElementById('linkedin').value = data.linkedin || '';
                document.getElementById('portfolio').value = data.portfolio || '';
                document.getElementById('about').value = data.about || '';

                if (data.name) {
                    const initials = data.name
                        .split(' ')
                        .map(w => w[0])
                        .join('')
                        .toUpperCase();
                    document.getElementById('avatar').innerText = initials;
                }

            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        /* ================= PROFILE UPDATE ================= */

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const profileData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                education: document.getElementById('education').value,
                about: document.getElementById('about').value,
                github: document.getElementById('github').value,
                linkedin: document.getElementById('linkedin').value,
                portfolio: document.getElementById('portfolio').value
            };

            try {
                const response = await fetch(`${API_BASE}/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });

                const result = await response.json();
                if (result.success) loadProfile();
            } catch (error) {
                console.error(error);
            }
        });

        /* ================= SKILLS ================= */

        async function loadSkills() {
            const response = await fetch(`${API_BASE}/profile`);
            const data = await response.json();
            console.log(data);
        }

        async function deleteSkill(skillId) {
            await fetch(`${API_BASE}/profile/skill/${skillId}`, {
                method: 'DELETE'
            });
            loadSkills();
        }

        /* ================= PROJECTS ================= */

        async function loadProjects() {
            const response = await fetch(`${API_BASE}/profile`);
            const data = await response.json();
            console.log(data);
        }

        /* ================= WORK EXPERIENCE ================= */

        async function loadWorkExperience() {
            const response = await fetch(`${API_BASE}/profile`);
            const data = await response.json();
            console.log(data);
        }

        window.onload = () => {
            loadProfile();
        };
    </script>

</body>

</html>
